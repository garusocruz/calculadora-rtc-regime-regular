[tool.poetry]
name = "calculadora-rtc-regime-regular"
version = "0.4.3"
description = "Implementação independente, em Python, da calculadora de código aberto da Receita Federal para o regime regular. Não é produto oficial nem homologado."
authors = ["Garuso Cruz <garustoec@gmail.com>"]
license = "MIT"
readme = "README.md"
packages = [{ include = "calculadora_rtc_regime_regular" }]

[tool.poetry.dependencies]
python = "^3.12"
lxml = "^6.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-cov = "^5.0"
pre-commit = "^4.5"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_functions = ["test_*", "teste_*"]
junit_family = "legacy"
addopts = "--cov=calculadora_rtc_regime_regular --cov-fail-under=80 --cov-report=term-missing"
